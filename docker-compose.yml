# Local lakehouse: Airflow 3 (LocalExecutor) + Postgres metadata DB + a local S3 endpoint (moto).
#   docker compose up -d --build      ->  Airflow UI http://localhost:8080
#                                         S3 endpoint http://localhost:9000 (any access key works)
# Point LAKE_URI at a real S3 bucket (and drop S3_ENDPOINT_URL) to run against AWS.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true" # local dev only: no login screen
  LAKE_URI: s3://nyc-taxi-lake
  S3_ENDPOINT_URL: http://s3:9000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
  DBT_PROJECT_DIR: /opt/airflow/dbt/taxi
  DBT_TARGET: s3
  DBT_LAKE_PATH: s3://nyc-taxi-lake
  DBT_DUCKDB_PATH: /opt/airflow/warehouse/taxi.duckdb
  DBT_S3_ENDPOINT: s3:9000
  DBT_S3_URL_STYLE: path
  DBT_S3_USE_SSL: "false"
  DBT_TARGET_PATH: /tmp/dbt-target # keep build artifacts out of the bind-mounted project
  DBT_LOG_PATH: /tmp/dbt-logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  s3:
    build: { context: docker, dockerfile: s3.Dockerfile }
    image: local-s3:latest
    ports: ["9000:9000"]

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: nyc-taxi-airflow:latest
    command: standalone
    environment: *airflow-env
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - warehouse:/opt/airflow/warehouse
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

volumes:
  postgres-data:
  warehouse:
