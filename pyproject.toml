[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-pipeline"
version = "1.0.0"
description = "Batch lakehouse pipeline for NYC TLC yellow taxi trips: Airflow + PySpark + Parquet on S3 + dbt"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vishal Mankala" }]
dependencies = [
    "pyspark>=4.0,<5",
    "pyarrow>=15",
    "pandas>=2.0",
    "duckdb>=1.0",
    "requests>=2.31",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "dbt-duckdb>=1.8"]

[project.scripts]
taxi-pipeline = "taxi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
