name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit + e2e tests, dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests dags
      - run: pytest
      - name: End-to-end on synthetic data (2 months) + dbt build
        run: |
          make demo MONTH=2024-01
          make demo MONTH=2024-02

  airflow-dag:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Airflow (with official constraints) + pipeline
        run: |
          pip install "apache-airflow==3.1.8" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.12.txt"
          pip install "pyspark==4.2.1" pytest
          pip install -e . --no-deps
      - run: pytest tests/test_dag.py

  docker-e2e:
    name: Docker stack against MinIO (S3)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build airflow
      - run: docker compose up -d --wait postgres minio
      - name: Seed, run Write-Audit-Publish on S3, build dbt marts from S3
        run: |
          docker compose run --rm airflow bash -c "
            taxi-pipeline seed-sample --month 2024-01 --rows 20000 &&
            taxi-pipeline run --month 2024-01 --skip-ingest &&
            cd /opt/airflow/dbt/taxi && dbt build --profiles-dir ."
      - if: always()
        run: docker compose down -v
